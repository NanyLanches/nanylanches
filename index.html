<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nany Lanches - PDV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Cabeçalho PDV -->
        <header class="bg-slate-800 p-4 rounded-xl shadow-md flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-amber-400">Nany Lanches - PDV</h1>
                <span id="statusBt" class="text-[10px] text-red-400 block mt-1 font-bold">Desconectada (Standby)</span>
            </div>
            <div>
                <button onclick="conectarImpressoraBluetooth()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                    🔗 Conectar Impressora Bluetooth
                </button>
            </div>
        </header>

        <!-- Área de Teste de Envio -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-md space-y-4">
            <h2 class="text-lg font-semibold text-slate-200">Painel de Comandas</h2>
            <p class="text-sm text-slate-400">Clique no botão abaixo para testar o envio direto para a Celark com reconexão automática:</p>
            <button onclick="enviarPedidoTeste()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-3 rounded-xl font-bold transition shadow-lg">
                🖨️ Enviar Comanda de Teste
            </button>
        </div>
    </div>

    <script>
        // Configuração do Bluetooth
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;

        async function conectarImpressoraBluetooth() {
            try {
                const statusEl = document.getElementById('statusBt');
                statusEl.innerText = "Buscando dispositivo...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '000018f0-0000-1000-8000-00805f9b34fb', 
                        '49535343-fe7d-4ae5-8fa9-9fafd205e455', 
                        '0000ff00-0000-1000-8000-00805f9b34fb', 
                        'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
                    ]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                await efetuarConexaoGATT();

            } catch (error) {
                console.error(error);
                document.getElementById('statusBt').innerText = "Desconectada / Erro";
                document.getElementById('statusBt').className = "text-[10px] text-red-400 block mt-1 font-bold";
                alert("Falha ao conectar: " + error.message);
            }
        }

        async function efetuarConexaoGATT() {
            const statusEl = document.getElementById('statusBt');
            statusEl.innerText = "Conectando...";
            
            if (!bluetoothDevice.gatt.connected) {
                await bluetoothDevice.gatt.connect();
            }

            const server = bluetoothDevice.gatt;
            const services = await server.getPrimaryServices();
            
            bluetoothCharacteristic = null;
            for (let service of services) {
                const characteristics = await service.getCharacteristics();
                for (let characteristic of characteristics) {
                    if (characteristic.properties.write || characteristic.properties.writeWithoutResponse) {
                        bluetoothCharacteristic = characteristic;
                        break;
                    }
                }
                if (bluetoothCharacteristic) break;
            }

            if (!bluetoothCharacteristic && services.length > 0) {
                const chars = await services[0].getCharacteristics();
                if (chars.length > 0) bluetoothCharacteristic = chars[0];
            }

            if (bluetoothCharacteristic) {
                statusEl.innerText = `Conectada (${bluetoothDevice.name || 'Celark'})`;
                statusEl.className = "text-[10px] text-emerald-400 block mt-1 font-bold";
            } else {
                throw new Error("Característica de escrita não encontrada.");
            }
        }

        function onDisconnected() {
            document.getElementById('statusBt').innerText = "Desconectada (Standby)";
            document.getElementById('statusBt').className = "text-[10px] text-red-400 block mt-1 font-bold";
            bluetoothCharacteristic = null;
        }

        // Função de envio com reconexão automática integrada contra ociosidade do notebook/impressora
        async function imprimirViaBluetoothDireto(texto) {
            try {
                // Se a conexão GATT caiu ou o objeto foi limpo por ociosidade, tenta reconectar instantaneamente
                if (!bluetoothCharacteristic || !bluetoothDevice || !bluetoothDevice.gatt.connected) {
                    if (bluetoothDevice) {
                        await efetuarConexaoGATT();
                    } else {
                        alert("Atenção: A impressora não está conectada. Clique em 'Conectar Impressora Bluetooth' no topo.");
                        return;
                    }
                }

                const encoder = new TextEncoder('utf-8');
                const data = encoder.encode(texto);
                
                // Envio seguro em blocos de 128 bytes para evitar buffer cheio na Celark
                const chunkSize = 128;
                for (let i = 0; i < data.length; i += chunkSize) {
                    let chunk = data.slice(i, i + chunkSize);
                    await bluetoothCharacteristic.writeValue(chunk);
                }
                
                const statusEl = document.getElementById('statusBt');
                if (statusEl) {
                    statusEl.innerText = `Conectada (${bluetoothDevice.name || 'Celark'})`;
                    statusEl.className = "text-[10px] text-emerald-400 block mt-1 font-bold";
                }

            } catch (err) {
                console.error("Erro ao enviar dados Bluetooth:", err);
                bluetoothCharacteristic = null;
                
                const statusEl = document.getElementById('statusBt');
                if (statusEl) {
                    statusEl.innerText = "Desconectada (Standby)";
                    statusEl.className = "text-[10px] text-red-400 block mt-1 font-bold";
                }

                alert("A impressora entrou em modo de descanso. Clique em 'Conectar Impressora Bluetooth' no topo para reativar o link.");
            }
        }

        function enviarPedidoTeste() {
            const comandaTeste = 
                "\x1B\x40" + // Inicializa impressora
                "\x1B\x61\x01" + // Centralizado
                "NANY LANCHES\n" +
                "--------------------------------\n" +
                "\x1B\x61\x00" + // Alinhado à esquerda
                "Pedido: #999\n" +
                "Cliente: Teste Balcao\n" +
                "--------------------------------\n" +
                "1x X-Bacon Especial\n" +
                "   - Sem cebola\n" +
                "1x Coca-Cola Lata\n" +
                "--------------------------------\n" +
                "TOTAL: R$ 35,00\n\n\n\x0A\x0A";

            imprimirViaBluetoothDireto(comandaTeste);
        }
    </script>
</body>
</html>
